# Next.js 16 — OpenNext adapter is applied automatically on Netlify.
# Site URL: https://maruf-hasan-chowdhury-profile.netlify.app

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Set in Netlify UI after Render API is live:
  # NEXT_PUBLIC_API_URL = https://YOUR-API.onrender.com
  # Or same-origin proxy (uncomment redirects below + use your Netlify URL as API_BASE).

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Contact form on live Netlify (Gmail SMTP via function env vars).
[[redirects]]
  from = "/api/v1/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/contact/"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# When Render API exists, add a rule BEFORE contact (more specific rules win) or proxy:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API.onrender.com/api/:splat"
#   status = 200
#   force = true