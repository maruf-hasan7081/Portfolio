# Free Django API on Render (SQLite + seed on each deploy). See DEPLOY.md.
# Optional: set DATABASE_URL to a free Neon Postgres URL for persistent DB.

services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # "1" only for first deploy — then set to "0" so admin edits are not wiped.
      - key: PORTFOLIO_SEED_ON_DEPLOY
        value: "0"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Optional override; settings.py also reads RENDER_EXTERNAL_HOSTNAME.
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: https://maruf-hasan-chowdhury-profile.netlify.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://maruf-hasan-chowdhury-profile.netlify.app